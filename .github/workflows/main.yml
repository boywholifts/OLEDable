name: Build EXE

# Every push to main: builds the app and installer and publishes them as a *dev* pre-release
# (version like 2.3.0-dev.14), which the app offers to people on the Dev update channel.
# Stable release: Actions tab -> Build EXE -> Run workflow -> tick "Publish as a stable release".
# It uses the <Version> in the csproj (e.g. 2.3.0), creates the tag v2.3.0 and the release, which
# everyone on Stable is offered. (Pushing a tag like v2.3.0 does the same.)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish as a stable release (uses the Version in HydroShiftRecorder.csproj)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Version
        shell: pwsh
        run: |
          # the base version comes from the project file; a tag like v2.3.0 sets it instead
          $ver = (Select-Xml -Path HydroShiftRecorder.csproj -XPath '//Version').Node.InnerText
          $stable = $false
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $ver = $Matches[1]; $stable = $true }
          elseif ('${{ inputs.release }}' -eq 'true') { $stable = $true }
          else { $ver = "$ver-dev.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STABLE=$($stable.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building $ver (stable: $stable)"

      - name: Build
        shell: pwsh
        run: |
          dotnet build HydroShiftRecorder.csproj -c Release -p:Version=$env:APP_VERSION -o dist
          if (-not (Test-Path dist\OLEDable.exe)) { throw 'Build failed: exe was not created' }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\OLEDable.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: OLEDable-${{ env.APP_VERSION }}
          path: |
            dist/OLEDable.exe
            dist-installer/*.exe

      - name: Publish dev pre-release
        if: env.STABLE != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Dev build ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Automatic dev build for testing (Dev update channel). Not a tested release.

            ${{ github.event.head_commit.message }}
          files: dist-installer/*.exe

      - name: Release notes
        if: env.STABLE == 'true'
        shell: pwsh
        run: |
          # release-notes/<version>.md is the "What's new" text (an empty one if it wasn't written)
          $f = "release-notes/$env:APP_VERSION.md"
          if (-not (Test-Path $f)) { New-Item -ItemType Directory -Force release-notes | Out-Null; Set-Content $f "" }

      - name: Publish release
        if: env.STABLE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: OLEDable ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body_path: release-notes/${{ env.APP_VERSION }}.md
          generate_release_notes: true
          files: |
            dist/OLEDable.exe
            dist-installer/*.exe
