name: Build EXE

# Every push to main: builds the app and installer and publishes them as a *dev* pre-release
# (version like 2.3.0-dev.14), which the app offers to people on the Dev update channel.
# Stable release: Actions tab -> Build EXE -> Run workflow -> tick "Publish as a stable release".
# It uses the <Version> in the csproj (e.g. 2.3.0), creates the tag v2.3.0 and the release, which
# everyone on Stable is offered. (Pushing a tag like v2.3.0 does the same.)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish as a stable release (uses the Version in OLEDable.csproj)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # lets the build sign in to Azure (code signing) without a stored password

# Code signing: Azure Artifact Signing (certificate "Jesse Sievers"). These are identifiers, not secrets:
# the build signs in through the app registration's federated credential for this repo's main branch.
env:
  AZURE_TENANT_ID: 30560747-e9fa-42ca-b083-47c5af84e864
  AZURE_CLIENT_ID: c80c2e3d-c973-432e-9f2e-b2e3ff1b99a8
  AZURE_SUBSCRIPTION_ID: 615495a1-fa51-4ad1-be6e-452f92947e1e
  SIGN_ENDPOINT: https://eus.codesigning.azure.net/
  SIGN_ACCOUNT: oledable
  SIGN_PROFILE: oledable

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Version
        shell: pwsh
        run: |
          # the base version comes from the project file; a tag like v2.3.0 sets it instead
          $ver = (Select-Xml -Path OLEDable.csproj -XPath '//Version').Node.InnerText
          $stable = $false
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $ver = $Matches[1]; $stable = $true }
          elseif ('${{ inputs.release }}' -eq 'true') { $stable = $true }
          else { $ver = "$ver-dev.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STABLE=$($stable.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building $ver (stable: $stable)"

      - name: Build
        shell: pwsh
        run: |
          dotnet build OLEDable.csproj -c Release -p:Version=$env:APP_VERSION -o dist
          if (-not (Test-Path dist\OLEDable.exe)) { throw 'Build failed: exe was not created' }

      # signing only from main (the Azure federated credential trusts this repo's main branch)
      - name: Azure login (code signing)
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the app
        if: github.ref == 'refs/heads/main'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGN_ENDPOINT }}
          signing-account-name: ${{ env.SIGN_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGN_PROFILE }}
          files: ${{ github.workspace }}\dist\OLEDable.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\OLEDable.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Sign the installer
        if: github.ref == 'refs/heads/main'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGN_ENDPOINT }}
          signing-account-name: ${{ env.SIGN_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGN_PROFILE }}
          files-folder: ${{ github.workspace }}\dist-installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check signatures
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          foreach ($f in @('dist\OLEDable.exe') + (Get-ChildItem dist-installer\*.exe).FullName) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f : $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$f is not signed correctly ($($sig.Status))" }
          }

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: OLEDable-${{ env.APP_VERSION }}
          path: |
            dist/OLEDable.exe
            dist-installer/*.exe

      - name: Publish dev pre-release
        if: env.STABLE != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Dev build ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Automatic dev build for testing (Dev update channel). Not a tested release.

            ${{ github.event.head_commit.message }}
          files: dist-installer/*.exe

      - name: Release notes
        if: env.STABLE == 'true'
        shell: pwsh
        run: |
          # release-notes/<version>.md is the "What's new" text (an empty one if it wasn't written)
          $f = "release-notes/$env:APP_VERSION.md"
          if (-not (Test-Path $f)) { New-Item -ItemType Directory -Force release-notes | Out-Null; Set-Content $f "" }

      - name: Publish release
        if: env.STABLE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: OLEDable ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body_path: release-notes/${{ env.APP_VERSION }}.md
          generate_release_notes: true
          files: |
            dist/OLEDable.exe
            dist-installer/*.exe

  # keep the Releases page short: the newest 5 dev builds stay, older ones go (stable releases are never touched)
  cleanup:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/cleanup.yml
    with:
      keep: "5"
