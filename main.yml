name: Build EXE

# Builds HydroShiftRecorder.exe on every push to main (download it from the run's "Artifacts"),
# and attaches it to a GitHub Release when you push a version tag like v1.0.0.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          $ver = '2.1.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)') { $ver = $Matches[1] }
          dotnet build HydroShiftRecorder.csproj -c Release -p:Version=$ver -o dist
          if (-not (Test-Path dist\HydroShiftRecorder.exe)) { throw 'Build failed: exe was not created' }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\HydroShiftRecorder.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: HydroShiftRecorder
          path: |
            dist/HydroShiftRecorder.exe
            dist-installer/*.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/HydroShiftRecorder.exe
            dist-installer/*.exe
          generate_release_notes: true
